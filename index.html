<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atomérite</title>
<meta name="description" content="Le site de la classe de M. Beauvilain">
<meta name="theme-color" content="#0E8FA3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atomérite">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  html, body { margin: 0; height: 100%; background: #0E8FA3; overflow: hidden; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
  #site { display: block; width: 100%; height: 100%; border: 0; background: #E6F7FA; }
  #accueil { position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 14px; background: linear-gradient(#2FC3D3, #0E8FA3 55%, #0B4F6C); color: #fff; font: 600 1.1rem system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; transition: opacity .4s; z-index: 2; padding: 20px; }
  #accueil img { width: 120px; height: 120px; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,.25); animation: nage 2.4s ease-in-out infinite; }
  #accueil h1 { margin: 0; font-size: 1.8rem; }
  #accueil p { margin: 0; opacity: .9; font-weight: 500; }
  #accueil a { color: #fff; font-weight: 700; }
  #secours { display: none; }
  .fini { opacity: 0; pointer-events: none; }
  @keyframes nage { 50% { transform: translateY(-8px) rotate(-3deg); } }
  @media (prefers-reduced-motion: reduce) { #accueil img { animation: none; } }
</style>
</head>
<body>
<div id="accueil">
  <img src="icone-192.png" alt="">
  <h1>Atomérite</h1>
  <p>On plonge dans le lagon… 🫧</p>
  <p id="secours">Ça prend du temps ? Vérifie ta connexion, ou <a href="https://script.google.com/macros/s/AKfycbzXkiT1VeH7LnGxClG-wVniLGpvLcYiXQYHyA_bYYcXnWccJUzIojziifz_awguGv8MLw/exec">ouvre le site directement</a>.</p>
</div>
<iframe id="site" title="Atomérite" allow="clipboard-write; fullscreen" src="https://script.google.com/macros/s/AKfycbzXkiT1VeH7LnGxClG-wVniLGpvLcYiXQYHyA_bYYcXnWccJUzIojziifz_awguGv8MLw/exec"></iframe>
<script>
  var accueil = document.getElementById('accueil');
  document.getElementById('site').addEventListener('load', function () { setTimeout(function () { accueil.className = 'fini'; }, 600); });
  setTimeout(function () { if (accueil.className !== 'fini') document.getElementById('secours').style.display = 'block'; }, 15000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
